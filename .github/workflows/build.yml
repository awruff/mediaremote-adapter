name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: ditto -c -k --keepParent build/MediaRemoteAdapter.framework MediaRemoteAdapter.framework.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MediaRemoteAdapter.framework
          path: MediaRemoteAdapter.framework.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MediaRemoteAdapter.framework.zip
            bin/mediaremote-adapter.pl
